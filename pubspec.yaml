name: glow_up
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  # State management — Cubit/Bloc
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  # رفع صور القياسات (قبل/بعد) — Feature 4
  image_picker: ^1.2.1
  # ضغط الصور قبل الرفع لـ Supabase Storage — UC-06
  flutter_image_compress: ^2.3.0
  # صلاحيات الكاميرا/الغاليري — UC-06 (Permission Denied case)
  permission_handler: ^12.0.0
  # عرض صور before/after من روابط Supabase بكفاءة (كاش)
  cached_network_image: ^3.4.1
  # إشعارات Push — UC-09, UC-10, UC-11
  firebase_core: ^4.11.0
  firebase_messaging: ^16.3.0
  # عرض الإشعارات داخل التطبيق (onMessage) — In-app Banner
  # ملاحظة: مثبتة على 19.5.0 عمداً لأن أي نسخة ≥20.0.0 بتتطلب Dart SDK ≥3.8
  # بينما مشروعك حالياً على Dart 3.7.2 (environment: sdk: ^3.7.2)
  flutter_local_notifications: ^19.5.0
  # فحص حالة الاتصال بالإنترنت — Error Cases بكل الـ UCs
  connectivity_plus: ^6.1.0
  # شكل الـ loading shimmer بشاشة UC-01
  shimmer: ^3.0.0
  # حفظ بيانات محلية (توكن الجلسة، role المستخدم...)
  shared_preferences: ^2.5.3
  # تنسيق التواريخ والأرقام بالعربي، حساب "منذ ساعة/يوم/أسبوع"
  # ملاحظة: flutter_localizations بتفرض نسخة intl متوافقة معها تلقائيًا،
  # فما بنحدد رقم نسخة ضيق هون عشان نتجنب تعارض تلقائي وقت pub get.
  intl: any
  go_router: ^16.3.0
  flutter_dotenv: ^6.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0369A1"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0369A1"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#0369A1"
    image: assets/splash/splash_logo.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
    - assets/splash/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700